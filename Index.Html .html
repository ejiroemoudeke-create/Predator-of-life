<title>Survival</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed 3D canvas, UI layer above it. Menus are cards on a dark asphalt ground; HUD sits in the corners. */
:root{--bg:#0e1013;--panel:#171b20;--panel2:#1f242b;--line:#2c333b;--fg:#eef0f2;--mute:#8d97a3;--accent:#ff5a1f;--accent2:#ffb02e;--good:#3ddc84;--bad:#ff3b3b;--blue:#37a0ff;
--display:'Teko','Arial Narrow',Impact,sans-serif;--body:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;background:#0b0d10}
#ui{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;box-sizing:border-box}
#ui>*{pointer-events:auto}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;letter-spacing:.04em;text-transform:uppercase;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.screen{position:absolute;inset:0;padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,rgba(14,16,19,.86),rgba(14,16,19,.96));overflow-y:auto;overflow-x:hidden;touch-action:pan-y;display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
.screen[hidden]{display:none!important}
.brand{font-family:var(--display);font-size:clamp(64px,16vw,120px);line-height:.85;letter-spacing:.08em;color:var(--fg);margin:0}
.brand b{color:var(--accent);font-weight:700}
.tag{color:var(--mute);letter-spacing:.18em;text-transform:uppercase;font-size:13px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.chip{background:var(--panel2);border:1px solid var(--line);padding:6px 12px;border-radius:4px;font-weight:600;font-variant-numeric:tabular-nums}
.chip.gold{color:var(--accent2)}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:14px 16px;text-align:left;font-family:var(--display);font-size:26px;letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:56px}
.btn small{font-family:var(--body);font-size:13px;letter-spacing:0;text-transform:none;color:var(--mute);font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#14100d}
.btn.primary small{color:#3b1a0b}
.btn:active{transform:translateY(1px);filter:brightness(1.15)}
.btn:disabled{opacity:.45}
.btn.sm{font-size:20px;padding:8px 12px;min-height:40px;display:inline-flex}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{font-size:24px}
.card p{margin:0;color:var(--mute);font-size:14px}
.card.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.card.lock{opacity:.5}
.stars{color:var(--accent2);letter-spacing:2px;font-size:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.opt{padding:8px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;font-weight:600}
.opt.on{background:var(--accent);border-color:var(--accent);color:#14100d}
.lbl{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:6px 0 4px}
.meter{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
table{border-collapse:collapse;width:100%}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
/* HUD */
#hud{position:absolute;inset:0;pointer-events:none}
#hud *{pointer-events:none}
#hud button,#hud .stick,#hud .gb,#hud #gest{pointer-events:auto}
#gest{position:absolute;inset:0;touch-action:none;display:none}
#hud.touchonly #gest{display:block}
#hud.touchonly .stick,#hud.touchonly #btns{display:none}
.ring{position:absolute;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;border:2px solid #fff5;background:radial-gradient(#fff2,#fff0 70%);opacity:0;transition:opacity .12s;pointer-events:none!important}
.ring.on{opacity:1}
.ring i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:#fffa;border:2px solid #0006}
.ring.fire,.ring.nitro{border-color:var(--accent);background:radial-gradient(#ff5a1f55,#ff5a1f00 70%)}
.ring.brake{border-color:var(--bad)}
#hint{position:absolute;left:50%;top:34%;transform:translateX(-50%);width:min(86vw,520px);padding:10px 14px;border-radius:6px;background:#000b;font-size:15px;line-height:1.35;text-align:center;opacity:0;transition:opacity .5s;pointer-events:none!important}
#hint.on{opacity:1}
#hud[hidden]{display:none}
.hbar{position:absolute;left:max(0px,env(safe-area-inset-left,0px));top:8px;width:min(34vw,210px);display:flex;flex-direction:column;gap:5px}
.hbar .meter{height:12px;border:1px solid #000;background:#0008}
#hpbar{background:var(--good)}#arbar{background:var(--blue)}
#cashv{font-family:var(--display);font-size:28px;color:var(--accent2);text-shadow:0 2px 0 #000}
#top{position:absolute;left:50%;top:8px;transform:translateX(-50%);text-align:center;text-shadow:0 2px 0 #000;max-width:40vw}
#objective{font-family:var(--display);font-size:22px;letter-spacing:.08em;text-transform:uppercase}
#timer{font-family:var(--display);font-size:38px;line-height:1;color:var(--accent2)}
#mini{position:absolute;right:0;top:8px;width:112px;height:112px;border:2px solid #000;border-radius:50%;background:#0009}
#stars{position:absolute;right:0;top:128px;font-size:22px;letter-spacing:3px;text-shadow:0 2px 0 #000;color:var(--accent2)}
#wpn{position:absolute;right:0;bottom:calc(46vh);font-family:var(--display);font-size:22px;text-align:right;text-shadow:0 2px 0 #000}
#toast{position:absolute;left:50%;top:24%;transform:translateX(-50%);font-family:var(--display);font-size:34px;text-align:center;text-shadow:0 3px 0 #000;opacity:0;transition:opacity .25s;white-space:nowrap}
#pausebtn{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:44px;height:44px;border-radius:50%;background:#000a;border:1px solid #fff4;color:#fff;font-size:16px}
.stick{position:absolute;bottom:max(18px,env(safe-area-inset-bottom,0px));width:132px;height:132px;border-radius:50%;background:radial-gradient(#fff1,#fff0 70%);border:2px solid #fff3;touch-action:none}
.stick i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:#fffa;border:2px solid #0006}
#stickL{left:6px}#stickR{right:6px;border-color:#ff5a1f66}
#btns{position:absolute;right:0;bottom:170px;width:200px;height:170px}
.gb{position:absolute;width:62px;height:62px;border-radius:50%;background:#000a;border:2px solid #fff5;color:#fff;font-family:var(--display);font-size:17px;letter-spacing:.04em;touch-action:none;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1}
.gb.on{background:var(--accent);color:#14100d}
#bUse{right:0;bottom:0}#bBrake{right:72px;bottom:0}#bNitro{right:144px;bottom:0}
#bSwap{right:0;bottom:72px}#bGren{right:72px;bottom:72px}#bMine{right:144px;bottom:72px}
#bUse{background:var(--accent);color:#14100d;width:70px;height:70px}
#bRotL,#bRotR{bottom:auto;right:auto;top:auto;font-size:22px;width:54px;height:54px}
#bRotL{position:fixed;left:max(8px,env(safe-area-inset-left,0px));bottom:max(168px,calc(env(safe-area-inset-bottom,0px) + 168px))}
#bRotR{position:fixed;left:calc(max(8px,env(safe-area-inset-left,0px)) + 62px);bottom:max(168px,calc(env(safe-area-inset-bottom,0px) + 168px))}
#loading{position:absolute;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:5}
@media (max-height:480px){#bRotL,#bRotR{bottom:140px}.stick{width:110px;height:110px}#btns{bottom:130px}.gb{width:54px;height:54px}#mini{width:96px;height:96px}#stars{top:112px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<canvas id="game"></canvas>
<div id="ui">
 <div id="hud" hidden>
  <div class="hbar"><div class="meter"><i id="hpbar" style="width:100%"></i></div><div class="meter"><i id="arbar" style="width:0"></i></div><div id="cashv">$0</div></div>
  <div id="top"><div id="objective"></div><div id="timer"></div></div>
  <canvas id="mini" width="224" height="224"></canvas>
  <div id="stars"></div>
  <div id="wpn"></div>
  <div id="toast"></div>
  <div id="gest"><div class="ring" id="ringL"><i></i></div><div class="ring" id="ringR"><i></i></div></div>

  </div>
 </div>
 <div id="screens"></div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* core: utilities, save data, sound, touch + keyboard input */
const G = { dt: 0, time: 0, state: 'menu', actors: [], vehicles: [], bullets: [], pickups: [], parts: [], props: [], ramps: [], colliders: [], mode: null, player: null, heat: 0, wanted: 0, shake: 0, weather: 'clear', paused: false };
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const wrap = a => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };
const dist = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const fmt = n => '$' + Math.round(n).toLocaleString('en-US');
const mmss = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

/* ---------- save ---------- */
const SAVE_KEY = 'survival.save.v1';
const defaultSave = () => ({
  cash: 1500, xp: 0,
  own: { veh: ['sedan', 'bike'], wpn: ['pistol', 'smg'], hat: ['none'] },
  sel: { veh: 'sedan', wpn: 'pistol' },
  look: { skin: '#6b4429', shirt: '#1f9d3f', pants: '#4a74b0', hat: 'none', g: 'm', hair: '#14100e', hs: 'fade', top: 'vneck', bot: 'jeans', shoe: '#f4f4f2', bracelet: true, build: 'slim', full: true, hero: true, hero2: true },
  stars: {}, best: {}, tasks: {}, stats: { kills: 0, wins: 0, events: 0, cash: 0, dist: 0, wrecks: 0 },
  set: { sound: true, quality: 'med', btn: 1, assist: true, zoom: 1, ctl: 'gest' }
});
G.save = defaultSave();
function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) { const o = JSON.parse(raw); const d = defaultSave(); G.save = Object.assign(d, o); G.save.set = Object.assign(d.set, o.set || {}); G.save.stats = Object.assign(d.stats, o.stats || {}); G.save.own = Object.assign(d.own, o.own || {}); if (!G.save.look || !G.save.look.hero2) G.save.look = d.look; }
  } catch (e) { /* storage unavailable: play without saving */ }
}
let saveTimer = 0;
function saveNow() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(G.save)); } catch (e) { } }
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 400); }
const levelOf = xp => Math.floor(Math.sqrt(xp / 120)) + 1;
const xpForLevel = l => (l - 1) * (l - 1) * 120;

/* ---------- sound (original WebAudio synth, starts after first tap) ----------
   Layered effects: every gun has a sharp crack + body thump + echo tail, blasts have a sub rumble,
   engines have gears, and police sirens loop while cops are chasing. */
const SND = { ctx: null, master: null, verb: null, noiseBuf: null, eng: null, sir: null, last: {} };
function sndInit() {
  if (SND.ctx) { if (SND.ctx.state === 'suspended') SND.ctx.resume(); return; }
  try {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const c = SND.ctx = new AC();
    const b = c.createBuffer(1, c.sampleRate * 2, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    SND.noiseBuf = b;
    const comp = c.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 6; comp.connect(c.destination);
    SND.master = c.createGain(); SND.master.gain.value = 0.9; SND.master.connect(comp);
    /* short outdoor echo: decaying noise impulse */
    const n = Math.floor(c.sampleRate * 0.9), ir = c.createBuffer(2, n, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const x = ir.getChannelData(ch); for (let i = 0; i < n; i++) x[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3.2); }
    SND.verb = c.createConvolver(); SND.verb.buffer = ir; const vg = c.createGain(); vg.gain.value = 0.35; SND.verb.connect(vg); vg.connect(SND.master);
    /* engine: two saws a hair apart + square sub, through a moving low-pass */
    const e = SND.eng = { o1: c.createOscillator(), o2: c.createOscillator(), o3: c.createOscillator(), lp: c.createBiquadFilter(), g: c.createGain(), nz: c.createBufferSource(), ng: c.createGain(), nf: c.createBiquadFilter() };
    e.o1.type = 'sawtooth'; e.o2.type = 'sawtooth'; e.o3.type = 'square'; e.lp.type = 'lowpass'; e.lp.frequency.value = 400; e.g.gain.value = 0;
    e.o1.connect(e.lp); e.o2.connect(e.lp); e.o3.connect(e.lp); e.lp.connect(e.g); e.g.connect(SND.master);
    e.nz.buffer = SND.noiseBuf; e.nz.loop = true; e.nf.type = 'bandpass'; e.nf.frequency.value = 300; e.ng.gain.value = 0; e.nz.connect(e.nf); e.nf.connect(e.ng); e.ng.connect(SND.master);
    e.o1.start(); e.o2.start(); e.o3.start(); e.nz.start();
    /* siren: two-tone wail */
    const sr = SND.sir = { o: c.createOscillator(), l: c.createOscillator(), lg: c.createGain(), g: c.createGain() };
    sr.o.type = 'triangle'; sr.o.frequency.value = 800; sr.l.type = 'sine'; sr.l.frequency.value = 0.55; sr.lg.gain.value = 260; sr.g.gain.value = 0;
    sr.l.connect(sr.lg); sr.lg.connect(sr.o.frequency); sr.o.connect(sr.g); sr.g.connect(SND.master); sr.o.start(); sr.l.start();
  } catch (e) { SND.ctx = null; }
}
function sfx(kind, vol = 1) {
  if (!SND.ctx || !G.save.set.sound || vol <= 0.02) return;
  const c = SND.ctx, t = c.currentTime;
  const now = performance.now(); if (SND.last[kind] && now - SND.last[kind] < 28) return; SND.last[kind] = now; /* stop stacking dozens of the same sound in one frame */
  const pit = () => 0.92 + Math.random() * 0.16;
  const out = (g, wet) => { g.connect(SND.master); if (wet) { const w = c.createGain(); w.gain.value = wet; g.connect(w); w.connect(SND.verb); } };
  const noise = (dur, freq, v, q = 0.8, type = 'bandpass', delay = 0, wet = 0, f1) => {
    const s = c.createBufferSource(); s.buffer = SND.noiseBuf; const f = c.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t + delay); if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + delay + dur); f.Q.value = q;
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t + delay); g.gain.linearRampToValueAtTime(v * vol, t + delay + 0.004); g.gain.exponentialRampToValueAtTime(0.001, t + delay + dur);
    s.connect(f); f.connect(g); out(g, wet); s.start(t + delay, Math.random()); s.stop(t + delay + dur + 0.02);
  };
  const tone = (f0, f1, dur, v, type = 'square', delay = 0, wet = 0) => {
    const o = c.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t + delay); o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + delay + dur);
    const g = c.createGain(); g.gain.setValueAtTime(v * vol, t + delay); g.gain.exponentialRampToValueAtTime(0.001, t + delay + dur);
    o.connect(g); out(g, wet); o.start(t + delay); o.stop(t + delay + dur + 0.02);
  };
  const p = pit();
  switch (kind) {
    case 'shot': /* pistol / rifle: crack, thump, echo */
      noise(0.05, 3200 * p, 0.5, 0.7, 'highpass', 0, 0.5); noise(0.16, 1400 * p, 0.45, 0.9, 'bandpass', 0, 0.6); tone(220 * p, 60, 0.12, 0.35, 'sine'); break;
    case 'smg':
      noise(0.04, 3800 * p, 0.35, 0.7, 'highpass', 0, 0.3); noise(0.09, 1800 * p, 0.3, 1, 'bandpass'); tone(260 * p, 90, 0.07, 0.2, 'sine'); break;
    case 'shotgun':
      noise(0.07, 2600, 0.7, 0.6, 'highpass', 0, 0.6); noise(0.4, 700 * p, 0.7, 0.6, 'lowpass', 0, 0.8, 200); tone(150 * p, 38, 0.3, 0.6, 'sine'); noise(0.12, 1500, 0.3, 1, 'bandpass', 0.42); /* pump */ tone(900, 500, 0.04, 0.15, 'square', 0.45); tone(500, 800, 0.04, 0.15, 'square', 0.55); break;
    case 'rocket':
      noise(0.7, 1800, 0.45, 0.5, 'lowpass', 0, 0.5, 300); tone(420, 90, 0.6, 0.18, 'sawtooth'); tone(80, 40, 0.5, 0.3, 'sine'); break;
    case 'boom': /* big explosion: blast, debris, sub rumble, long echo tail */
      noise(0.12, 4000, 0.8, 0.5, 'highpass', 0, 0.4); noise(1.3, 900, 1.0, 0.5, 'lowpass', 0, 0.9, 90); tone(110, 24, 1.1, 0.9, 'sine', 0, 0.4); tone(55, 20, 1.5, 0.55, 'sine'); noise(0.5, 2500, 0.25, 1, 'bandpass', 0.35, 0.5); break;
    case 'hit': noise(0.05, 2400 * p, 0.2, 2); tone(900 * p, 300, 0.05, 0.1, 'triangle'); break;
    case 'crash': noise(0.35, 500, 0.7, 0.6, 'lowpass', 0, 0.3, 120); noise(0.12, 3000, 0.4, 1.5, 'bandpass'); tone(120, 40, 0.2, 0.4, 'sine'); noise(0.2, 4500, 0.15, 4, 'bandpass', 0.12); break; /* metal + glass */
    case 'gren': tone(1300, 900, 0.05, 0.15, 'square'); tone(500, 300, 0.08, 0.1, 'triangle', 0.06); break;
    case 'mine': tone(1000, 1000, 0.08, 0.15, 'square'); tone(1000, 1000, 0.08, 0.15, 'square', 0.16); break;
    case 'reload': tone(1200, 700, 0.03, 0.2, 'square'); tone(700, 1100, 0.04, 0.2, 'square', 0.45); noise(0.04, 2500, 0.15, 2, 'bandpass', 0.45); break;
    case 'door': noise(0.12, 300, 0.4, 0.8, 'lowpass'); tone(160, 70, 0.12, 0.3, 'sine'); break;
    case 'horn': tone(420, 420, 0.35, 0.18, 'sawtooth'); tone(530, 530, 0.35, 0.14, 'sawtooth'); break;
    case 'skid': noise(0.3, 2600, 0.12, 5, 'bandpass', 0, 0, 3400); break;
    case 'pick': tone(700, 1400, 0.1, 0.2, 'triangle'); tone(1400, 1800, 0.08, 0.15, 'triangle', 0.08); break;
    case 'cash': tone(1568, 1568, 0.07, 0.18, 'triangle'); tone(2093, 2093, 0.18, 0.18, 'triangle', 0.07); break; /* ka-ching */
    case 'ui': tone(520, 760, 0.05, 0.12, 'triangle'); break;
    case 'win': [523, 659, 784, 1046].forEach((f, i) => tone(f, f, 0.22, 0.2, 'triangle', i * 0.12, 0.3)); break;
    case 'lose': [392, 330, 262, 196].forEach((f, i) => tone(f, f * 0.97, 0.3, 0.22, 'sawtooth', i * 0.18, 0.3)); break;
    case 'wasted': tone(240, 50, 0.9, 0.3, 'sawtooth', 0, 0.4); noise(0.6, 400, 0.3, 0.6, 'lowpass'); break;
    case 'siren': break;
  }
}
/* engine: pitch follows speed through simulated gears; type sets the character */
function engineSound(speedFrac, on, type = '') {

  { id: 'e1', name: 'First Call', city: 'steel', mode: 'deathmatch', cfg: { bots: 4, target: 10, diff: 0.3 } },

EVENTS.forEach((e, i) => { e.n = i + 1; });
function eventUnlocked(e) { const i = EVENTS.indexOf(e); return i === 0 || (G.save.stars[EVENTS[i - 1].id] || 0) >= 1; }

/* ----- tasks: hourly / daily / weekly, regenerated when their time bucket changes ----- */
const TASK_POOL = [
  { stat: 'kills', text: n => 'Get ' + n + ' kills', t: [8, 25, 90] },
  { stat: 'wrecks', text: n => 'Destroy ' + n + ' vehicles', t: [2, 6, 20] },

  const pl = G.player; if (src === pl && v !== pl) { G.save.stats.kills++; if (v.team === 0) crime(0.8); else if (v.team === 3) crime(2.2); }
  if (v.team === 3 && src === pl) S.copKills++;

};
G.hooks.onVehDestroyed = (v, src) => { if (src === G.player) { if (v.team === 0) crime(0.5); else if (v.team === 3) crime(1.2); } if (G.mode && G.mode.onVehDestroyed) G.mode.onVehDestroyed(v, src); };
